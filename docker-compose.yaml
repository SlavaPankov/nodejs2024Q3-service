version: '3.8'

services:
  # Контейнер для приложения
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./.env:/usr/src/app/.env
    environment:
      DB_HOST: postgres # Адрес контейнера базы данных
      DB_PORT: 5432
      DB_USERNAME: user
      DB_PASSWORD: admin
      DB_NAME: db
    depends_on:
      - postgres
    networks:
      - app-network
    ports:
      - '4000:4000' # Порт для доступа к приложению
      - '5555:5555' # Порт для доступа к Prisma Studio

    # Контейнер для базы данных PostgreSQL
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - '5432:5432' # Опционально, для доступа к базе данных вне контейнера

networks:
  app-network:
    driver: bridge

volumes:
  pgdata: