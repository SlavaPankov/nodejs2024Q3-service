version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./.env:/usr/src/app/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: user
      DB_PASSWORD: admin
      DB_NAME: db
    depends_on:
      - postgres
    networks:
      - app-network
    ports:
      - '4000:4000'
      - '5555:5555'

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - '5432:5432'

networks:
  app-network:
    driver: bridge

volumes:
  pgdata: